name: Atualizar e publicar o painel

on:
  # O Transferegov publica a carga por volta das 6h30 de Brasília. O agendamento do GitHub atrasa
  # horas (em 01 e 02/11 rodou às 13h40 e às 17h10), então há várias tentativas no dia, fora da hora
  # cheia; cada uma só baixa os dados quando a carga mudou.
  schedule:
    - cron: "37 9,11,13,16,20 * * *"  # 6h37, 8h37, 10h37, 13h37 e 17h37 em Brasília (UTC-3)
  workflow_dispatch:       # rodar à mão pela aba Actions
  push:                    # mudança no painel: publica de novo sem baixar dados
    branches: [main]
    paths: ["painel/index.html", "site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    outputs:
      nova: ${{ steps.carga.outputs.nova }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: dados/instrumentos.csv
          sparse-checkout-cone-mode: false
      - name: Comparar a carga do Transferegov com a do painel
        id: carga
        run: |
          curl -sSfL --retry 3 -o dc.zip https://api-publica.transferegov.gestao.gov.br/downloads/dadosgov/data_carga_siconv.zip
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import csv, io, sys, zipfile
          from datetime import datetime
          z = zipfile.ZipFile("dc.zip")
          linhas = io.TextIOWrapper(z.open(z.namelist()[0]), encoding="utf-8-sig").read().split()
          fonte = datetime.strptime(linhas[1], "%d/%m/%Y").strftime("%Y-%m-%d")
          painel = next(csv.DictReader(open("dados/instrumentos.csv", encoding="utf-8")))["data_carga"][:10]
          print(f"Transferegov {fonte}, painel {painel}", file=sys.stderr)
          print("nova=" + str(fonte != painel).lower())
          PY

  atualizar:
    needs: verificar
    if: github.event_name != 'schedule' || needs.verificar.outputs.nova == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Baixar a carga do Transferegov e gerar os CSVs
        if: github.event_name != 'push'
        run: python atualizar_dados.py

      - name: Guardar os CSVs no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Sem mudança nos dados."
          else
            carga=$(python -c "import csv; print(next(csv.DictReader(open('dados/instrumentos.csv', encoding='utf-8')))['data_carga'][:10])")
            git commit -m "Carga do Transferegov de $carga"
            git push
          fi

      - name: Montar o site
        run: python site/montar_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
