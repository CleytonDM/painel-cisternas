name: Atualizar e publicar o painel

on:
  # O Transferegov publica a carga por volta das 8h15 de Brasília (em 03/11, às 8h13), e o agendamento
  # do GitHub atrasa horas ou pula horários. Por isso uma execução de vigia começa cedo e consulta a
  # data da carga a cada 5 minutos até a carga nova aparecer; a atualização roda logo em seguida.
  # Os outros horários são reserva: conferem uma vez e só baixam se a carga mudou.
  schedule:
    - cron: "7 8 * * *"           # vigia: 5h07 em Brasília (UTC-3)
    - cron: "37 15,19,23 * * *"   # reserva: 12h37, 16h37 e 20h37
  workflow_dispatch:       # rodar à mão pela aba Actions
    inputs:
      vigiar:
        description: "Esperar a carga nova do Transferegov antes de atualizar"
        type: boolean
        default: false
  push:                    # mudança no painel: publica de novo sem baixar dados
    branches: [main]
    paths: ["painel/index.html", "site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      nova: ${{ steps.carga.outputs.nova }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: dados/instrumentos.csv
          sparse-checkout-cone-mode: false
      - name: Comparar a carga do Transferegov com a do painel
        id: carga
        env:
          VIGIAR: ${{ github.event.schedule == '7 8 * * *' || inputs.vigiar == true }}
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import csv, io, os, sys, time, urllib.request, zipfile
          from datetime import datetime, timezone

          URL = "https://api-publica.transferegov.gestao.gov.br/downloads/dadosgov/data_carga_siconv.zip"
          painel = next(csv.DictReader(open("dados/instrumentos.csv", encoding="utf-8")))["data_carga"][:10]
          vigiar = os.environ["VIGIAR"] == "true"
          inicio = time.time()

          def carga_fonte():
              # parâmetro novo a cada consulta para não receber a cópia antiga do cache da Cloudflare
              with urllib.request.urlopen(f"{URL}?v={time.time_ns()}", timeout=60) as r:
                  z = zipfile.ZipFile(io.BytesIO(r.read()))
              linhas = io.TextIOWrapper(z.open(z.namelist()[0]), encoding="utf-8-sig").read().split()
              return datetime.strptime(linhas[1], "%d/%m/%Y").strftime("%Y-%m-%d")

          while True:
              agora = datetime.now(timezone.utc)
              try:
                  fonte = carga_fonte()
              except Exception as erro:
                  fonte = None
                  print(f"{agora:%H:%M} UTC: falha ao consultar o Transferegov ({erro})", file=sys.stderr)
              if fonte:
                  print(f"{agora:%H:%M} UTC: Transferegov {fonte}, painel {painel}", file=sys.stderr)
              if fonte and fonte != painel:
                  print("nova=true")
                  break
              # a vigia desiste às 16h UTC (13h em Brasília) ou perto do limite de 6 h do job
              if not vigiar or agora.hour >= 16 or time.time() - inicio > 5.5 * 3600:
                  print("nova=false")
                  break
              time.sleep(300)
          PY

  atualizar:
    needs: verificar
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.vigiar) || needs.verificar.outputs.nova == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # só a atualização entra na fila; a vigia esperando não segura as publicações do painel
    concurrency:
      group: painel
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # a ponta de main no momento do job: a vigia pode ter começado horas antes de um commit novo
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Baixar a carga do Transferegov e gerar os CSVs
        if: github.event_name != 'push'
        run: python atualizar_dados.py

      - name: Guardar os CSVs no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Sem mudança nos dados."
          else
            carga=$(python -c "import csv; print(next(csv.DictReader(open('dados/instrumentos.csv', encoding='utf-8')))['data_carga'][:10])")
            git commit -m "Carga do Transferegov de $carga"
            git push
          fi

      - name: Montar o site
        run: python site/montar_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
