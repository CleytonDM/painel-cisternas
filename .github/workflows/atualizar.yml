name: Atualizar e publicar o painel

on:
  # O Transferegov publica a carga por volta das 8h15 de Brasília (em 03/11, às 8h13), e o agendamento
  # do GitHub atrasa de 3 a 10 horas ou pula horários. Por isso há uma execução por hora de madrugada;
  # cada uma que rodar antes da publicação consulta a data da carga a cada 5 minutos e atualiza logo
  # que a carga nova aparece. Basta uma delas rodar a tempo. As da tarde e da noite são reserva.
  schedule:
    - cron: "30 6-11 * * *"       # 3h30, 4h30, 5h30, 6h30, 7h30 e 8h30 em Brasília (UTC-3)
    - cron: "37 15,19,23 * * *"   # reserva: 12h37, 16h37 e 20h37
  workflow_dispatch:       # rodar à mão pela aba Actions
    inputs:
      vigiar:
        description: "Esperar a carga nova do Transferegov antes de atualizar"
        type: boolean
        default: false
  push:                    # mudança no painel: publica de novo sem baixar dados
    branches: [main]
    paths: ["painel/index.html", "site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      nova: ${{ steps.carga.outputs.nova }}
      fonte: ${{ steps.carga.outputs.fonte }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: dados/instrumentos.csv
          sparse-checkout-cone-mode: false
      - name: Comparar a carga do Transferegov com a do painel
        id: carga
        env:
          VIGIAR: ${{ github.event_name == 'schedule' || inputs.vigiar == true }}
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import csv, io, os, subprocess, sys, time, urllib.request, zipfile
          from datetime import datetime, timezone

          URL = "https://api-publica.transferegov.gestao.gov.br/downloads/dadosgov/data_carga_siconv.zip"
          vigiar = os.environ["VIGIAR"] == "true"
          inicio = time.time()

          def carga_fonte():
              # parâmetro novo a cada consulta para não receber a cópia antiga do cache da Cloudflare
              with urllib.request.urlopen(f"{URL}?v={time.time_ns()}", timeout=60) as r:
                  z = zipfile.ZipFile(io.BytesIO(r.read()))
              linhas = io.TextIOWrapper(z.open(z.namelist()[0]), encoding="utf-8-sig").read().split()
              return datetime.strptime(linhas[1], "%d/%m/%Y").strftime("%Y-%m-%d")

          def carga_painel():
              # lida da ponta de main a cada volta: outra execução pode ter atualizado enquanto esta esperava
              subprocess.run(["git", "fetch", "-q", "--depth=1", "origin", "main"], check=True)
              texto = subprocess.run(["git", "show", "FETCH_HEAD:dados/instrumentos.csv"], check=True,
                                     capture_output=True, text=True, encoding="utf-8").stdout
              return next(csv.DictReader(io.StringIO(texto)))["data_carga"][:10]

          while True:
              agora = datetime.now(timezone.utc)
              try:
                  fonte, painel = carga_fonte(), carga_painel()
                  print(f"{agora:%H:%M} UTC: Transferegov {fonte}, painel {painel}", file=sys.stderr)
              except Exception as erro:
                  fonte = painel = None
                  print(f"{agora:%H:%M} UTC: falha na consulta ({erro})", file=sys.stderr)
              if fonte and fonte != painel:
                  print(f"nova=true\nfonte={fonte}")
                  break
              # quem espera desiste às 16h UTC (13h em Brasília) ou perto do limite de 6 h do job
              if not vigiar or agora.hour >= 16 or time.time() - inicio > 5.5 * 3600:
                  print("nova=false")
                  break
              time.sleep(300)
          PY

  atualizar:
    needs: verificar
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.vigiar) || needs.verificar.outputs.nova == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # só a atualização entra na fila; as execuções esperando a carga não seguram as publicações do painel
    concurrency:
      group: painel
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # a ponta de main no momento do job: a execução pode ter começado horas antes de um commit novo
      - uses: actions/checkout@v5
        with:
          ref: main

      # Duas execuções podem ver a carga nova quase juntas; a segunda espera na fila e, quando chega
      # a vez dela, a carga já está em main. Aí não há o que fazer.
      - name: Conferir se outra execução já trouxe esta carga
        id: trava
        env:
          FONTE: ${{ needs.verificar.outputs.fonte }}
        run: |
          painel=$(python3 -c "import csv; print(next(csv.DictReader(open('dados/instrumentos.csv', encoding='utf-8')))['data_carga'][:10])")
          if [ -n "$FONTE" ] && [ "$FONTE" = "$painel" ]; then
            echo "A carga $FONTE já foi publicada por outra execução."
            echo "feita=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.trava.outputs.feita != 'true'
        with:
          python-version: "3.13"
          cache: pip

      - if: steps.trava.outputs.feita != 'true'
        run: pip install -r requirements.txt

      - name: Baixar a carga do Transferegov e gerar os CSVs
        if: steps.trava.outputs.feita != 'true' && github.event_name != 'push'
        run: python atualizar_dados.py

      - name: Guardar os CSVs no repositório
        if: steps.trava.outputs.feita != 'true' && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Sem mudança nos dados."
          else
            carga=$(python -c "import csv; print(next(csv.DictReader(open('dados/instrumentos.csv', encoding='utf-8')))['data_carga'][:10])")
            git commit -m "Carga do Transferegov de $carga"
            # O GitHub às vezes recusa o push com erro interno (em 04/11, "Internal Server Error").
            # Tenta de novo, trazendo antes algum commit que tenha entrado em main enquanto isso.
            for espera in 30 60 120 240 0; do
              git push && break
              [ "$espera" -eq 0 ] && { echo "::error::Não foi possível gravar a carga $carga."; exit 1; }
              echo "Push recusado; nova tentativa em $espera s."
              sleep "$espera"
              git pull --rebase -q origin main
            done
          fi

      - name: Montar o site
        if: steps.trava.outputs.feita != 'true'
        run: python site/montar_site.py

      - uses: actions/configure-pages@v5
        if: steps.trava.outputs.feita != 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.trava.outputs.feita != 'true'
        with:
          path: _site
      - id: deploy
        if: steps.trava.outputs.feita != 'true'
        uses: actions/deploy-pages@v4
