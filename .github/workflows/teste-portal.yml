name: Teste da API do Portal da Transparência

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar duas notas de empenho
        env:
          CHAVE: ${{ secrets.PORTAL_TRANSPARENCIA_CHAVE }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          BASE = "https://api.portaldatransparencia.gov.br/api-de-dados"
          def get(caminho):
              req = urllib.request.Request(BASE + caminho, headers={"chave-api-dados": os.environ["CHAVE"], "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, json.loads(r.read() or b"null")
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:300].decode("utf-8", "ignore")
          for ne in ["550008000012024NE000035", "550008000012026NE000122"]:
              print("=====", ne)
              st, doc = get(f"/despesas/documentos/{ne}")
              print("documento", st, json.dumps(doc, ensure_ascii=False)[:1500])
              st, itens = get(f"/despesas/itens-de-empenho?codigoDocumento={ne}&pagina=1")
              print("itens", st, json.dumps(itens, ensure_ascii=False)[:1500])
              for it in (itens if isinstance(itens, list) else [])[:3]:
                  seq = it.get("sequencial")
                  st, h = get(f"/despesas/itens-de-empenho/historico?codigoDocumento={ne}&sequencial={seq}&pagina=1")
                  print("historico", seq, st, json.dumps(h, ensure_ascii=False)[:1500])
              st, rel = get(f"/despesas/documentos-relacionados?codigoDocumento={ne}&fase=1")
              print("relacionados", st, json.dumps(rel, ensure_ascii=False)[:1500])
              time.sleep(2)
          PY
